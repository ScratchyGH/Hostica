<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — Hostica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Geist',system-ui,sans-serif;background:#0a0908;color:#fff}

canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

.wrap{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px}

.logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:rgba(255,255,255,.45);text-decoration:none;position:fixed;top:20px;left:24px;letter-spacing:.01em;transition:color .2s}
.logo:hover{color:rgba(255,255,255,.8)}
.logo svg{color:#e77c3e}

.code{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.15em;color:rgba(231,124,62,.6);text-transform:uppercase;margin-bottom:18px}

.num{font-size:clamp(80px,18vw,160px);font-weight:700;line-height:1;letter-spacing:-.04em;background:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}

.msg{font-size:clamp(16px,2.5vw,22px);font-weight:400;color:rgba(255,255,255,.55);margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:rgba(255,255,255,.28);text-align:center;max-width:340px;line-height:1.6;margin-bottom:36px}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-home{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;background:rgba(231,124,62,.15);border:1px solid rgba(231,124,62,.35);color:rgba(255,255,255,.85);border-radius:8px;text-decoration:none;font-size:13px;font-weight:500;font-family:'Geist',sans-serif;transition:background .2s,border-color .2s}
.btn-home:hover{background:rgba(231,124,62,.28);border-color:rgba(231,124,62,.6)}
.btn-back{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:8px;text-decoration:none;font-size:13px;font-weight:500;font-family:'Geist',sans-serif;cursor:pointer;transition:background .2s}
.btn-back:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}

.ground{position:fixed;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(231,124,62,.25),transparent)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<a class="logo" href="index.html">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
Hostica
</a>

<div class="wrap">
<div class="code">Error 404</div>
<div class="num">404</div>
<div class="msg">Page not found</div>
<div class="sub">The page you're looking for doesn't exist or may have been moved.</div>
<div class="actions">
<a class="btn-home" href="index.html">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
Go home
</a>
<button class="btn-back" onclick="history.back()">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
Go back
</button>
</div>
</div>

<div class="ground"></div>

<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,particles=[],grid=[],mouse={x:-999,y:-999};

function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
buildGrid();
}

function buildGrid(){
grid=[];
const gap=52;
for(let x=0;x<W+gap;x+=gap){
for(let y=0;y<H+gap;y+=gap){
grid.push({x,y,ox:x,oy:y,vx:0,vy:0});
}
}
}

function spawnParticle(){
const side=Math.floor(Math.random()*4);
let x,y;
if(side===0){x=Math.random()*W;y=-10;}
else if(side===1){x=W+10;y=Math.random()*H;}
else if(side===2){x=Math.random()*W;y=H+10;}
else{x=-10;y=Math.random()*H;}
const angle=Math.atan2(H/2-y,W/2-x)+( Math.random()-.5)*1.2;
const speed=.4+Math.random()*.5;
particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,size:Math.random()*1.5+.5,decay:.0015+Math.random()*.002});
}

window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('touchmove',e=>{mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;},{passive:true});

let frame=0;
function tick(){
requestAnimationFrame(tick);
ctx.clearRect(0,0,W,H);
frame++;
if(frame%4===0&&particles.length<120)spawnParticle();

ctx.save();
for(const p of grid){
const dx=mouse.x-p.ox,dy=mouse.y-p.oy;
const dist=Math.sqrt(dx*dx+dy*dy);
const force=Math.max(0,1-dist/180);
const repel=force*force*18;
p.vx+=(-dx/Math.max(dist,1))*repel*.08;
p.vy+=(-dy/Math.max(dist,1))*repel*.08;
p.vx+=(p.ox-p.x)*.04;
p.vy+=(p.oy-p.y)*.04;
p.vx*=.82;p.vy*=.82;
p.x+=p.vx;p.y+=p.vy;
const brightness=force*0.45;
ctx.beginPath();
ctx.arc(p.x,p.y,1,0,Math.PI*2);
ctx.fillStyle=`rgba(${Math.round(80+brightness*120)},${Math.round(60+brightness*40)},${Math.round(50+brightness*20)},${0.18+brightness*.5})`;
ctx.fill();
}
ctx.restore();

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;p.y+=p.vy;
p.vx*=.998;p.vy*=.998;
p.life-=p.decay;
if(p.life<=0||p.x<-20||p.x>W+20||p.y<-20||p.y>H+20){particles.splice(i,1);continue;}
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
const a=p.life*.45;
ctx.fillStyle=`rgba(231,124,62,${a})`;
ctx.shadowBlur=8;
ctx.shadowColor='rgba(231,124,62,.6)';
ctx.fill();
ctx.shadowBlur=0;
}

const cx=W/2,cy=H/2;
const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.65);
grad.addColorStop(0,'rgba(231,124,62,.04)');
grad.addColorStop(.4,'rgba(231,124,62,.015)');
grad.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=grad;
ctx.fillRect(0,0,W,H);
}

resize();window.addEventListener('resize',resize);tick();
})();
</script>
</body>
</html>
